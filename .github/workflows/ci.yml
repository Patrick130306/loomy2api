name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show dependency footprint (should be empty)
        run: python -c "import loomy2api, sys; print(loomy2api.__version__, sys.version)"

      - name: Byte-compile
        run: python -m compileall -q loomy2api tests

      - name: Unit tests (hermetic — no network, no account needed)
        run: python -m unittest discover -s tests -t . -v

      - name: CLI smoke test
        run: |
          python -m loomy2api --help
          python -m loomy2api accounts
        env:
          LOOMY_ACCOUNTS_FILE: accounts.empty.json
          LOOMY_LOG_DIR: /tmp/loomy-logs
